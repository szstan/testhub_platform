user nginx;
worker_processes 1;
pid /var/run/testhub-staging-nginx.pid;
error_log /var/log/nginx/testhub-staging-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 100m;
    access_log /var/log/nginx/testhub-staging-access.log;

    server {
        listen 18003;
        server_name 192.168.1.109 localhost;
        root /opt/testhub_platform/frontend/dist;
        index index.html;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location /static/ {
            alias /opt/testhub_platform/static_files/;
        }

        location /media/ {
            alias /opt/testhub_platform/media/;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:18002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:18002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }
}
