[pytest]
DJANGO_SETTINGS_MODULE = backend.test_settings
python_files = tests.py test_*.py *_test.py *_tests.py
python_classes = Test* *Tests
python_functions = test_*
testpaths = apps/users/tests apps/testsuites/tests apps/core_tests apps/core apps/testcases apps/defects apps/llm_judge apps/mcp/tests apps/monitor/tests apps/perf_testing/tests apps/quality_intelligence/tests
addopts = --reuse-db -v --tb=short
