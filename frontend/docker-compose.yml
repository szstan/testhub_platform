services:
  # 前端应用
  frontend:
    image: nginx:1.27-alpine
    container_name: testhub_frontend
    restart: always
    ports:
      - "8003:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - testhub_network

networks:
  testhub_network:
    driver: bridge
