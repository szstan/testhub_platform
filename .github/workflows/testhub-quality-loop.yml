name: TestHub quality loop pilot

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: TestHub project ID
        required: true
        type: string
      baseline_job_id:
        description: Optional baseline TestHub job ID
        required: false
        type: string
      max_unmatched:
        description: Maximum unmatched imported tests for this pilot; set to 0 after TestHub cases are materialized
        required: false
        default: '1000'
        type: string
      test_suite:
        description: Allowlisted test suite to run on the staging runner
        required: true
        default: backend
        type: choice
        options:
          - backend
          - ci-token
          - full

permissions:
  contents: read

jobs:
  quality-loop:
    runs-on: [self-hosted, linux, x64, testhub-staging]
    timeout-minutes: 45
    env:
      TESTHUB_BASE_URL: ${{ vars.TESTHUB_BASE_URL }}
      TESTHUB_PROJECT_ID: ${{ inputs.project_id }}
      TESTHUB_MAX_UNMATCHED: ${{ inputs.max_unmatched }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install backend dependencies
        shell: bash
        run: |
          python3.12 -m venv "$RUNNER_TEMP/testhub-ci-venv"
          "$RUNNER_TEMP/testhub-ci-venv/bin/python" --version
          "$RUNNER_TEMP/testhub-ci-venv/bin/python" -m pip install -r requirements-prod.txt
          echo "$RUNNER_TEMP/testhub-ci-venv/bin" >> "$GITHUB_PATH"

      - name: Validate TestHub configuration
        shell: bash
        run: |
          test -n "$TESTHUB_BASE_URL"
          test -n "$TESTHUB_PROJECT_ID"
          python scripts/testhub_ci.py --help >/dev/null

      - name: Run project tests
        shell: bash
        run: |
          case "${{ inputs.test_suite }}" in
            backend)
              python -m pytest -q \
                --ignore=apps/app_automation/tests/test_app_flow.py \
                --ignore=apps/app_automation/tests/test_executor.py \
                --junitxml=test-results.xml
              ;;
            ci-token)
              python -m pytest -q apps/users/tests/test_ci_token.py --junitxml=test-results.xml
              ;;
            full)
              python -m pytest -q --junitxml=test-results.xml
              ;;
            *)
              echo 'Unknown test suite' >&2
              exit 2
              ;;
          esac

      - name: Import JUnit results
        id: import
        shell: bash
        env:
          TESTHUB_TOKEN: ${{ secrets.TESTHUB_TOKEN }}
        run: |
          test -n "$TESTHUB_TOKEN"
          case "$TESTHUB_TOKEN" in
            th_ci_*) ;;
            *) echo 'TESTHUB_TOKEN must be a long-lived th_ci service token' >&2; exit 1 ;;
          esac
          test -s test-results.xml
          python scripts/testhub_ci.py \
            --base-url "$TESTHUB_BASE_URL" \
            import-results \
            --project-id "$TESTHUB_PROJECT_ID" \
            --format junit \
            --external-run-id "github-${{ github.run_id }}" \
            --build-reference "${{ github.sha }}" \
            --file test-results.xml > testhub-import.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open('testhub-import.json', encoding='utf-8') as handle:
              print(f"job_id={json.load(handle)['job_id']}")
          PY

      - name: Evaluate TestHub release gate
        shell: bash
        env:
          BASELINE_JOB_ID: ${{ inputs.baseline_job_id }}
          TESTHUB_TOKEN: ${{ secrets.TESTHUB_TOKEN }}
        run: |
          args=(
            --job-id "${{ steps.import.outputs.job_id }}"
            --max-failed 0
            --max-unmatched "$TESTHUB_MAX_UNMATCHED"
          )
          if test -n "$BASELINE_JOB_ID"; then
            args+=(--baseline-job-id "$BASELINE_JOB_ID")
          fi
          python scripts/testhub_ci.py \
            --base-url "$TESTHUB_BASE_URL" \
            release-gate \
            "${args[@]}"

      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: testhub-quality-loop-${{ github.run_id }}
          path: |
            test-results.xml
            testhub-import.json
          if-no-files-found: ignore
