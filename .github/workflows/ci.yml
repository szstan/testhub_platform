name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: testhub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-prod.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-prod.txt

      - name: Run backend performance checks
        env:
          APP_ENV: development
          DJANGO_SETTINGS_MODULE: backend.test_settings
          SECRET_KEY: ci-only-not-for-production
          DEBUG: 'True'
          ALLOWED_HOSTS: 127.0.0.1,localhost
          DB_HOST: 127.0.0.1
          DB_NAME: testhub_ci
          DB_USER: root
          DB_PASSWORD: ci-password
          REDIS_URL: redis://127.0.0.1:6379/0
          PERF_MAX_CONCURRENCY: '1000'
          PERF_MAX_TARGET_RPS: '5000'
          PERF_MAX_DURATION: '7200'
          PERF_MAX_CONCURRENT_EXECUTIONS: '2'
          PERF_RETENTION_DAYS: '90'
          PERF_ARTIFACT_RETENTION_DAYS: '30'
          PERF_LOAD_GEN_CPU_WARN: '85'
        run: python scripts/ci_perf_checks.py

  backend-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-prod.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-prod.txt

      - name: Validate pinned backend runtime dependencies
        run: python scripts/validate_runtime_dependencies.py --requirements requirements-prod.txt

      - name: Validate web runtime boundary
        run: python scripts/validate_linux_runtime.py --profile web --repo-root "$PWD"

      - name: Run backend regression tests
        env:
          SECRET_KEY: ci-only-not-for-production
          DEBUG: 'True'
          ALLOWED_HOSTS: 127.0.0.1,localhost
        run: |
          python -m pytest -q \
            --ignore=apps/app_automation/tests/test_app_flow.py \
            --ignore=apps/app_automation/tests/test_executor.py

      - name: Check OpenAPI contract compatibility
        env:
          APP_ENV: development
          SECRET_KEY: ci-only-not-for-production
          DEBUG: 'True'
          ALLOWED_HOSTS: 127.0.0.1,localhost
        run: python scripts/api_contract_check.py --baseline docs/openapi-contract-baseline.yaml

      - name: Validate Linux dependency artifact builder
        run: |
          python -m py_compile scripts/build_linux_wheelhouse.py
          python scripts/build_linux_wheelhouse.py --help
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          touch "$tmp_dir/demo-1.0-py3-none-any.whl"
          python scripts/build_linux_wheelhouse.py \
            --output "$tmp_dir" \
            --manifest-only \
            --requirements requirements-prod.txt \
            --requirements requirements-app-optional.txt \
            --requirements requirements-report-optional.txt
          test -s "$tmp_dir/manifest.json"
          test -s "$tmp_dir/manifest.sha256"
          test -s "$tmp_dir/SHA256SUMS"
          touch "$tmp_dir/bad-1.0-py3-none-win_amd64.whl"
          if python scripts/build_linux_wheelhouse.py \
            --output "$tmp_dir" \
            --manifest-only \
            --requirements requirements-prod.txt \
            --requirements requirements-app-optional.txt \
            --requirements requirements-report-optional.txt; then
            echo 'Windows artifact was not rejected' >&2
            exit 1
          fi

  backend-migration-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: testhub_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-prod.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-prod.txt

      - name: Apply migrations on MySQL 8
        env:
          APP_ENV: development
          DEBUG: 'False'
          SECRET_KEY: ci-only-not-for-production
          ALLOWED_HOSTS: 127.0.0.1,localhost
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: testhub_ci
          DB_USER: root
          DB_PASSWORD: ci-password
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py showmigrations

  backend-app-automation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-prod.txt
            requirements-app-optional.txt
            requirements-report-optional.txt

      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install APP worker system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y adb

      - name: Install APP automation test dependencies
        run: |
          python -m pip install -r requirements-prod.txt
          python -m pip install -r requirements-app-optional.txt
          python -m pip install -r requirements-report-optional.txt

      - name: Validate pinned APP runtime dependencies
        run: python scripts/validate_runtime_dependencies.py --requirements requirements-prod.txt requirements-app-optional.txt requirements-report-optional.txt

      - name: Verify APP worker runtime dependencies
        run: |
          python scripts/validate_linux_runtime.py --profile automation --repo-root "$PWD"
          python -m pip check
          python -c "import airtest.core.api, allure, allure_pytest; print('APP Python dependencies: OK')"
          export APP_ADB_PATH="$(command -v adb)"
          test -n "$APP_ADB_PATH"
          test -x "$APP_ADB_PATH"
          "$APP_ADB_PATH" version
          test -x allure/bin/allure
          allure/bin/allure --version

      - name: Run APP automation security tests
        env:
          SECRET_KEY: ci-only-not-for-production
          DEBUG: 'True'
          ALLOWED_HOSTS: 127.0.0.1,localhost
        run: python -m pytest -q apps/app_automation/tests/test_security_boundaries.py

      - name: Run APP worker and WebSocket focused tests
        env:
          SECRET_KEY: ci-only-not-for-production
          DEBUG: 'True'
          ALLOWED_HOSTS: 127.0.0.1,localhost
        run: python -m pytest -q apps/app_automation/tests/test_security_boundaries.py apps/app_automation/tests/test_execution_views.py apps/app_automation/tests/test_executor.py apps/app_automation/tests/test_websocket_events.py

      - name: Run APP UI Flow safety gate
        env:
          SECRET_KEY: ci-only-not-for-production
          DEBUG: 'True'
          ALLOWED_HOSTS: 127.0.0.1,localhost
          APP_DEVICE_ID: ${{ vars.APP_DEVICE_ID }}
          APP_PACKAGE_NAME: ${{ vars.APP_PACKAGE_NAME }}
          APP_TEST_CASE_ID: ${{ vars.APP_TEST_CASE_ID }}
          APP_EXECUTION_ID: ${{ vars.APP_EXECUTION_ID }}
        run: |
          if [ -z "${APP_DEVICE_ID:-}" ] || [ -z "${APP_PACKAGE_NAME:-}" ] || [ -z "${APP_TEST_CASE_ID:-}" ] || [ -z "${APP_EXECUTION_ID:-}" ]; then
            echo 'APP UI Flow safety gate skipped: no approved device/execution fixture was provided.'
            exit 0
          fi
          python -m pytest -q apps/app_automation/tests/test_app_flow.py -m app_ui_flow

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Set up Python for release packaging
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate release packaging and staging checks
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/build_release_archive.py \
            --output "$RUNNER_TEMP/testhub-release.tar.gz" \
            --release "$GITHUB_SHA"
          python scripts/validate_release_manifest.py \
            --archive "$RUNNER_TEMP/testhub-release.tar.gz" \
            --release "$GITHUB_SHA"
          python - <<'PY'
          import tarfile
          from pathlib import Path
          archive = Path(__import__('os').environ['RUNNER_TEMP']) / 'testhub-release.tar.gz'
          with tarfile.open(archive, 'r:gz') as handle:
              members = {member.name: member for member in handle.getmembers()}
          assert any(name.endswith('/frontend/dist/index.html') for name in members)
          validator = next(name for name in members if name.endswith('/scripts/validate_staging_release.sh'))
          assert members[validator].mode & 0o111
          allure = next(name for name in members if name.endswith('/allure/bin/allure'))
          assert members[allure].mode & 0o111
          assert not any('/node_modules/' in name for name in members)
          assert not any(name.rsplit('/', 1)[-1].startswith('.env') for name in members)
          assert not any(name.endswith(('.pem', '.key')) for name in members)
          PY
          bash -n scripts/validate_staging_release.sh frontend/deploy.sh
